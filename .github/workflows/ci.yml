name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # test result annotations
  pull-requests: write   # test summary comment on PRs

env:
  # Plain, non-interactive Gradle output so errors are readable in the Actions log.
  GRADLE_OPTS: -Dorg.gradle.console=plain
  ANDROID_PLATFORM: platforms;android-35
  ANDROID_BUILD_TOOLS: build-tools;35.0.0

jobs:
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run core unit tests
        run: ./gradlew -PcoreOnly=true :accessai-core:test --continue

      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          check_name: Core test results
          report_paths: accessai-core/build/test-results/test/*.xml
          detailed_summary: true
          include_passed: false

      - name: Upload core test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: accessai-core/build/reports/tests/

  android:
    name: Android build, lint and sample APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the Android command-line tools and accepts the SDK licenses.
      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }} platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile all modules
        run: ./gradlew assemble --continue

      - name: Unit tests
        run: ./gradlew test --continue

      - name: Android lint
        run: ./gradlew :accessai-android:lintRelease :accessai-compose:lintRelease :sample:lintDebug --continue

      - name: Verify JitPack publishing
        run: ./gradlew publishToMavenLocal -x test

      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          check_name: Android test results
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false

      - name: Upload sample APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accessai-sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload SDK libraries (AAR / JAR)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accessai-sdk-libraries
          path: |
            accessai-android/build/outputs/aar/*-release.aar
            accessai-compose/build/outputs/aar/*-release.aar
            accessai-core/build/libs/*.jar
          if-no-files-found: error

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
          if-no-files-found: ignore
